chor="start">06</text><text x="66" y="359" class="card-title" text-anchor="start">Revoked watch</text><text x="66" y="379" class="card-meta" text-anchor="start">Revoked</text><circle cx="366" cy="359" r="5" fill="#FF6B6B"/></g><g data-screen="UpdateRequired" transform="translate(36 976)"><rect width="400" height="400" rx="28" fill="#101315" stroke="#2F353A"/><path d="M18 38V18h20M362 18h20v20M18 362v20h20M362 382h20v-20" fill="none" stroke="#454C52" stroke-width="1.5"/><circle cx="200" cy="176" r="148" fill="#030405" stroke="#464D53" stroke-width="2" filter="url(#watchShadow)"/><circle cx="200" cy="176" r="139" fill="url(#watchFace)" stroke="#23282D"/><text x="200" y="65" class="eyebrow" text-anchor="middle">COMPATIBILITY</text><path d="M200 77l28 47h-56z" fill="none" stroke="#FFBE55" stroke-width="4" stroke-linejoin="round"/><path d="M200 91v16" stroke="#FFBE55" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="116" r="2.5" fill="#FFBE55"/><text x="200" y="153" class="title" text-anchor="middle">Update required</text><text x="200" y="181" class="body" text-anchor="middle">This version cannot use</text><text x="200" y="198" class="body" text-anchor="middle">the bridge safely</text><rect x="116" y="251" width="168" height="28" rx="14" fill="#FFBE55" stroke="#FFBE55" stroke-opacity="0"/><text x="200" y="269.5" class="pill" fill="#050505" text-anchor="middle">About updates</text><text x="28" y="359" class="card-index" text-anchor="start">07</text><text x="66" y="359" class="card-title" text-anchor="start">Update required</text><text x="66" y="379" class="card-meta" text-anchor="start">UpdateRequired</text><circle cx="366" cy="359" r="5" fill="#FFBE55"/></g>
