ndex" text-anchor="start">03</text><text x="66" y="359" class="card-title" text-anchor="start">Mac identity</text><text x="66" y="379" class="card-meta" text-anchor="start">MacIdentity</text><circle cx="366" cy="359" r="5" fill="#6EB7FF"/></g><g data-screen="Connecting" transform="translate(36 554)"><rect width="400" height="400" rx="28" fill="#101315" stroke="#2F353A"/><path d="M18 38V18h20M362 18h20v20M18 362v20h20M362 382h20v-20" fill="none" stroke="#454C52" stroke-width="1.5"/><circle cx="200" cy="176" r="148" fill="#030405" stroke="#464D53" stroke-width="2" filter="url(#watchShadow)"/><circle cx="200" cy="176" r="139" fill="url(#watchFace)" stroke="#23282D"/><text x="200" y="65" class="eyebrow" text-anchor="middle">PRIVATE LINK</text><path d="M185 117a22 22 0 1 1 30 0" fill="none" stroke="#6EB7FF" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="101" r="4" fill="#6EB7FF"/><text x="200" y="153" class="title" text-anchor="middle">Connecting</text><text x="200" y="181" class="body" text-anchor="middle">Opening a signed</text><text x="200" y="198" class="body" text-anchor="middle">Relay session</text><text x="28" y="359" class="card-index" text-anchor="start">04</text><text x="66" y="359" class="card-title" text-anchor="start">Connecting</text><text x="66" y="379" class="card-meta" text-anchor="start">Connecting</text><circle cx="366" cy="359" r="5" fill="#6EB7FF"/></g><g data-screen="Offline" transform="translate(460 554)"><rect width="400" height="400" rx="28" fill="#101315" stroke="#2F353A"/><path d="M18 38V18h20M362 18h20v20M18 362v20h20M362 382h20v-20" fill="none" stroke="#454C52" stroke-width="1.5"/><circle cx="200" cy="176" r="148" fill="#030405" stroke="#464D53" stroke-width="2" filter="url(#watchShadow)"/><circle cx="200" cy="176" r="139" fill="url(#watchFace)" stroke="#23282D"/><text x="200" y="65" class="eyebrow" text-anchor="middle">CONNECTION</text><path d="M200 77l28 47h-56z" fill="none" stroke="#FFBE55" stroke-width="4" stroke-linejoin="