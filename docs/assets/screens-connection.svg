  <text x="122" y="40" class="board-eyebrow" text-anchor="start">CONNECTION / ONBOARDING</text>
  <text x="122" y="75" class="board-title" text-anchor="start">Get the watch safely online</text>
  <text x="122" y="101" class="board-description" text-anchor="start">Pair once, verify the Mac, and fail clearly when the link is not safe.</text>
