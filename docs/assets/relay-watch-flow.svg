<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Relay Galaxy Watch6 interface flow</title>
  <desc id="desc">Six circular dark watch screens showing Inbox, Approval, Voice, Transcript, Task, and New Task states.</desc>
  <rect width="1400" height="700" rx="28" fill="#f4f4f4"/>
  <style>
    .shell{fill:#090909;stroke:#1d1d1d;stroke-width:10}.eye{font:11px Arial,sans-serif;letter-spacing:1.5px;fill:#8d8d8d;text-anchor:middle}.title{font:700 22px Arial,sans-serif;fill:#f8f8f8;text-anchor:middle}.body{font:14px Arial,sans-serif;fill:#f2f2f2}.meta{font:12px Arial,sans-serif;fill:#8d8d8d}.line{stroke:#292929;stroke-width:1}.button{fill:#fff}.buttonText{font:700 16px Arial,sans-serif;fill:#090909;text-anchor:middle}.ghost{fill:#151515;stroke:#3a3a3a}.ghostText{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle}.label{font:700 15px Arial,sans-serif;fill:#171717;text-anchor:middle}.arrow{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#arrow)}.code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f7f7f7}.green{fill:#35c76f}.amber{fill:#fdb022}
  </style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#aaa"/></marker></defs>

  <path class="arrow" d="M244 190H275"/><path class="arrow" d="M464 190H495"/><path class="arrow" d="M684 190H715"/><path class="arrow" d="M904 190H935"/><path class="arrow" d="M1124 190H1155"/>

  <g transform="translate(54 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye" x="100" y="62">INBOX · ●</text><text class="title" x="100" y="95">2</text><line class="line" x1="42" y1="112" x2="158" y2="112"/><circle class="ghost" cx="55" cy="132" r="14"/><text class="body" x="78" y="137">Command</text><line class="line" x1="42" y1="153" x2="158" y2="153"/><circle class="ghost" cx="55" cy="174" r="14"/><text class="body" x="78" y="179">Question</text><rect class="button" x="73" y="205" width="54" height="29" rx="15"/><text class="buttonText" x="100" y="225">●</text><text class="label" x="100" y="256">Inbox</text></g>

  <g transform="translate(274 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye amber" x="100" y="62">HIGH RISK</text><text class="title" x="100" y="93">Approve?</text><rect x="39" y="108" width="122" height="42" rx="7" fill="#171717" stroke="#303030"/><text class="code" x="50" y="132">git push origin</text><text class="meta" x="100" y="170" text-anchor="middle">mmart · network write</text><rect class="ghost" x="48" y="198" width="42" height="32" rx="16"/><text class="ghostText" x="69" y="220">×</text><rect class="button" x="110" y="198" width="42" height="32" rx="16"/><text class="buttonText" x="131" y="220">✓</text><text class="label" x="100" y="256">Approval</text></g>

  <g transform="translate(494 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye" x="100" y="62">LISTENING</text><g stroke="#fff" stroke-width="3"><line x1="75" y1="105" x2="75" y2="137"/><line x1="86" y1="94" x2="86" y2="148"/><line x1="97" y1="102" x2="97" y2="140"/><line x1="108" y1="87" x2="108" y2="155"/><line x1="119" y1="99" x2="119" y2="143"/><line x1="130" y1="108" x2="130" y2="134"/></g><text class="meta" x="100" y="174" text-anchor="middle">relay · GPT-5.6</text><rect class="button" x="62" y="198" width="76" height="31" rx="16"/><text class="buttonText" x="100" y="219">Release</text><text class="label" x="100" y="256">Voice</text></g>

  <g transform="translate(714 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye" x="100" y="62">TRANSCRIPT</text><rect x="39" y="82" width="122" height="80" rx="8" fill="#171717" stroke="#303030"/><text class="body" x="50" y="108">Run tests.</text><text class="body" x="50" y="130">Fix only our</text><text class="body" x="50" y="150">failures.</text><rect class="ghost" x="43" y="196" width="38" height="31" rx="16"/><text class="ghostText" x="62" y="217">↺</text><rect class="ghost" x="81" y="196" width="38" height="31" rx="16"/><text class="ghostText" x="100" y="217">×</text><rect class="button" x="119" y="196" width="38" height="31" rx="16"/><text class="buttonText" x="138" y="217">↑</text><text class="label" x="100" y="256">Review</text></g>

  <g transform="translate(934 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye" x="100" y="62">RUNNING</text><text class="title" x="100" y="91">Tests</text><text class="meta" x="100" y="110" text-anchor="middle">mmart · GPT-5.6</text><rect x="39" y="124" width="122" height="48" rx="7" fill="#171717" stroke="#303030"/><circle class="green" cx="50" cy="140" r="4"/><text class="code" x="60" y="145">pnpm test:e2e</text><text class="meta" x="50" y="164">18 ✓</text><rect class="ghost" x="48" y="198" width="42" height="32" rx="16"/><text class="ghostText" x="69" y="219">■</text><rect class="button" x="110" y="198" width="42" height="32" rx="16"/><text class="buttonText" x="131" y="219">●</text><text class="label" x="100" y="256">Task</text></g>

  <g transform="translate(1154 64)"><circle class="shell" cx="100" cy="126" r="100"/><text class="eye" x="100" y="62">NEW TASK</text><line class="line" x1="42" y1="80" x2="158" y2="80"/><text class="body" x="47" y="103">▱ relay</text><line class="line" x1="42" y1="116" x2="158" y2="116"/><text class="body" x="47" y="140">✦ GPT-5.6</text><rect x="39" y="154" width="122" height="39" rx="7" fill="#171717" stroke="#303030"/><text class="meta" x="48" y="178">Build pairing flow…</text><rect class="ghost" x="48" y="203" width="42" height="30" rx="15"/><text class="ghostText" x="69" y="224">‹</text><rect class="button" x="110" y="203" width="42" height="30" rx="15"/><text class="buttonText" x="131" y="224">↑</text><text class="label" x="100" y="256">New task</text></g>

  <g transform="translate(115 405)"><rect width="1170" height="185" rx="18" fill="#0b0b0b"/><text x="40" y="44" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.6" fill="#858585">REMOTE CONTROL FLOW</text><text x="40" y="82" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">See what needs you. Approve. Speak. Keep Codex moving.</text><text x="40" y="118" font-family="Arial,sans-serif" font-size="15" fill="#a0a0a0">Circular safe areas · icon-first controls · exact text where safety matters · physical Watch6 validation</text><g transform="translate(40 141)"><circle cx="7" cy="7" r="7" fill="#fff"/><text x="24" y="12" font-family="Arial,sans-serif" font-size="13" fill="#fff">Watch</text><path d="M88 7h50" stroke="#555"/><circle cx="156" cy="7" r="7" fill="#fff"/><text x="173" y="12" font-family="Arial,sans-serif" font-size="13" fill="#fff">HTTPS</text><path d="M240 7h50" stroke="#555"/><circle cx="308" cy="7" r="7" fill="#fff"/><text x="325" y="12" font-family="Arial,sans-serif" font-size="13" fill="#fff">Mac bridge</text><path d="M425 7h50" stroke="#555"/><circle cx="493" cy="7" r="7" fill="#fff"/><text x="510" y="12" font-family="Arial,sans-serif" font-size="13" fill="#fff">Codex</text></g></g>
</svg>

