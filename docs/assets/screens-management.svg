D53" stroke-width="2" filter="url(#watchShadow)"/><circle cx="200" cy="176" r="139" fill="url(#watchFace)" stroke="#23282D"/><text x="200" y="65" class="eyebrow" text-anchor="middle">SETTINGS</text><text x="200" y="102" class="title" text-anchor="middle">Relay preferences</text><text x="86" y="149" class="item" text-anchor="start">Connection</text><rect x="265" y="134" width="47" height="24" rx="12" fill="#1D432B" stroke="#62E790"/><circle cx="299" cy="146" r="8" fill="#62E790"/><text x="86" y="187" class="item" text-anchor="start">Live monitoring</text><rect x="265" y="172" width="47" height="24" rx="12" fill="#1D432B" stroke="#62E790"/><circle cx="299" cy="184" r="8" fill="#62E790"/><text x="86" y="225" class="item" text-anchor="start">Refresh</text><text x="309" y="225" class="meta" text-anchor="end">15 min</text><rect x="82" y="253" width="102" height="28" rx="14" fill="#191D20" stroke="#A2A8B0" stroke-opacity="0.48"/><text x="133" y="271.5" class="pill" fill="#A2A8B0" text-anchor="middle">Unpair watch</text><rect x="192" y="253" width="126" height="28" rx="14" fill="#62E790" stroke="#62E790" stroke-opacity="0"/><text x="255" y="271.5" class="pill" fill="#050505" text-anchor="middle">Refresh now</text><text x="28" y="359" class="card-index" text-anchor="start">27</text><text x="66" y="359" class="card-title" text-anchor="start">Settings</text><text x="66" y="379" class="card-meta" text-anchor="start">Settings</text><circle cx="366" cy="359" r="5" fill="#62E790"/></g><g data-screen="About" transform="translate(884 132)"><rect width="400" height="400" rx="28" fill="#101315" stroke="#2F353A"/><path d="M18 38V18h20M362 18h20v20M18 362v20h20M362 382h20v-20" fill="none" stroke="#454C52" stroke-width="1.5"/><circle cx="200" cy="176" r="148" fill="#030405" stroke="#464D53" stroke-width="2" filter="url(#watchShadow)"/><circle cx="200" cy="176" r="139" fill="url(#watchFace)" stroke="#23282D"/><text x="200" y="65" class="eyebrow" text-anchor="middle">ABOUT RELAY</text><cir