  <text x="122" y="40" class="board-eyebrow" text-anchor="start">MANAGEMENT</text>
  <text x="122" y="75" class="board-title" text-anchor="start">Audit, tune, and understand Relay</text>
  <text x="122" y="101" class="board-description" text-anchor="start">History stays visible; connection, monitoring, license, and versions stay explicit.</text>
