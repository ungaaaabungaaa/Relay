name: Quality

on:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node and release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type-check
        run: pnpm typecheck

  apple-silicon:
    name: Apple platforms
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and smoke-test bridge sidecar
        run: |
          pnpm build:bridge-sea
          pnpm smoke:bridge-sea
          file dist/relay-bridge-arm64 | grep arm64
      - name: Test and build Mac app
        run: |
          swift test --package-path mac
          swift build --package-path mac --configuration release --arch arm64
      - name: Test and build Apple Watch
        run: |
          swift test --package-path apple-watch
          scripts/check-watchos-source.sh
          xcodebuild \
            -project apple-watch/RelayWatch.xcodeproj \
            -scheme RelayWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "${RUNNER_TEMP}/relay-watch-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload bridge sidecar
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relay-bridge-arm64
          path: dist/relay-bridge-arm64
          if-no-files-found: error
