name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, verify, and publish
    runs-on: macos-15
    environment: release
    env:
      RELAY_VERSION: ${{ github.ref_name }}
      RELAY_WATCH_VERSION_CODE: ${{ vars.RELAY_WATCH_VERSION_CODE }}
      RELAY_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.RELAY_RELEASE_PUBLIC_KEY_BASE64 }}
      CODEX_MIN_VERSION: ${{ vars.CODEX_MIN_VERSION }}
      CODEX_MAX_VERSION: ${{ vars.CODEX_MAX_VERSION }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELAY_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.RELAY_RELEASE_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release inputs
        run: |
          version=${RELAY_VERSION#v}
          test "${RELAY_VERSION}" = "v${version}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -n "${RELAY_WATCH_VERSION_CODE}"
          test -n "${RELAY_RELEASE_PUBLIC_KEY_BASE64}"
          test -n "${CODEX_MIN_VERSION}"
          test -n "${CODEX_MAX_VERSION}"
          test -n "${APPLE_SIGNING_IDENTITY}"
          test -n "${APPLE_CERTIFICATE_BASE64}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_ID}"
          test -n "${APPLE_APP_SPECIFIC_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          test -n "${RELAY_RELEASE_PRIVATE_KEY_BASE64}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELAY_VERSION}")"
          echo "RELAY_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install release toolchains without an emulator
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Import protected signing material
        run: |
          signing_root="${RUNNER_TEMP}/relay-signing"
          mkdir -p "${signing_root}"
          chmod 700 "${signing_root}"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${signing_root}/developer-id.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${signing_root}/relay-android.jks"
          chmod 600 "${signing_root}/developer-id.p12" "${signing_root}/relay-android.jks"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "${keychain_password}" "${signing_root}/relay.keychain-db"
          security set-keychain-settings -lut 21600 "${signing_root}/relay.keychain-db"
          security unlock-keychain -p "${keychain_password}" "${signing_root}/relay.keychain-db"
          security import "${signing_root}/developer-id.p12" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${signing_root}/relay.keychain-db"
          security list-keychain -d user -s "${signing_root}/relay.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${signing_root}/relay.keychain-db"
          xcrun notarytool store-credentials relay-notary \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --keychain "${signing_root}/relay.keychain-db"
          echo "ANDROID_KEYSTORE_PATH=${signing_root}/relay-android.jks" >> "${GITHUB_ENV}"
          echo "RELAY_SIGN_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
          echo "RELAY_OUTPUT_DIR=${GITHUB_WORKSPACE}/release/out" >> "${GITHUB_ENV}"
          echo "RELAY_NOTARY_KEYCHAIN=${signing_root}/relay.keychain-db" >> "${GITHUB_ENV}"
      - name: Run all automated release gates
        run: |
          pnpm test
          pnpm typecheck
          ./gradlew :wear:testDebugUnitTest :wear:lintDebug
          swift test --package-path mac
      - name: Build and verify signed watch APK
        run: |
          ./gradlew :wear:assembleRelease
          mkdir -p release/out
          cp wear/build/outputs/apk/release/wear-release.apk release/out/relay-wear.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs release/out/relay-wear.apk
          node scripts/scan-apk-secrets.mjs --apk release/out/relay-wear.apk
      - name: Build and sign the bridge and Mac app
        run: |
          pnpm build:bridge-sea
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            dist/relay-bridge-arm64
          pnpm smoke:bridge-sea
          RELAY_APK_PATH="${GITHUB_WORKSPACE}/release/out/relay-wear.apk" \
            scripts/package-mac-app.sh
          cp dist/relay-bridge-arm64 release/out/relay-bridge-arm64
      - name: Notarize and staple
        run: |
          xcrun notarytool submit release/out/Relay.dmg \
            --keychain-profile relay-notary \
            --keychain "${RELAY_NOTARY_KEYCHAIN}" \
            --wait
          xcrun stapler staple release/out/Relay.dmg
          xcrun stapler validate release/out/Relay.dmg
          codesign --verify --deep --strict --verbose=2 release/out/Relay.app
      - name: Assemble signed release metadata
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md docs/COMPATIBILITY.md release/out/
          git archive \
            --format=tar.gz \
            --prefix="Relay-${RELAY_VERSION}/" \
            --output="release/out/Relay-${RELAY_VERSION}.tar.gz" \
            "${GITHUB_SHA}"
          node scripts/create-release-manifest.mjs \
            --artifacts release/out \
            --tag "v${RELAY_VERSION}" \
            --watch-version-code "${RELAY_WATCH_VERSION_CODE}" \
            --codex-min "${CODEX_MIN_VERSION}" \
            --codex-max "${CODEX_MAX_VERSION}" \
            --output release/out/release-payload.json
          node scripts/sign-release.mjs \
            --payload release/out/release-payload.json \
            --output release/out/release-manifest.json
          APKSIGNER_PATH="${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            node scripts/verify-release.mjs \
            --manifest release/out/release-manifest.json \
            --artifacts release/out \
            --tag "v${RELAY_VERSION}" \
            --public-key-base64 "${RELAY_RELEASE_PUBLIC_KEY_BASE64}" \
            --verify-apk-signature
          cd release/out
          shasum -a 256 \
            Relay.dmg \
            relay-wear.apk \
            relay-bridge-arm64 \
            "Relay-${RELAY_VERSION}.tar.gz" \
            LICENSE \
            NOTICE \
            THIRD_PARTY_NOTICES.md \
            COMPATIBILITY.md \
            release-manifest.json > SHA256SUMS
      - name: Upload verified GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/out/Relay.dmg
            release/out/relay-wear.apk
            release/out/relay-bridge-arm64
            release/out/Relay-*.tar.gz
            release/out/SHA256SUMS
            release/out/release-manifest.json
            release/out/LICENSE
            release/out/NOTICE
            release/out/THIRD_PARTY_NOTICES.md
            release/out/COMPATIBILITY.md
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/relay-signing/relay.keychain-db" || true
          rm -f \
            "${RUNNER_TEMP}/relay-signing/developer-id.p12" \
            "${RUNNER_TEMP}/relay-signing/relay-android.jks"
