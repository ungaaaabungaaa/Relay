name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, verify, and publish
    runs-on: macos-15
    environment: release
    env:
      RELAY_VERSION: ${{ github.ref_name }}
      RELAY_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.RELAY_RELEASE_PUBLIC_KEY_BASE64 }}
      RELAY_SPARKLE_PUBLIC_KEY: ${{ vars.RELAY_SPARKLE_PUBLIC_KEY }}
      RELAY_SPARKLE_STABLE_FEED_URL: ${{ vars.RELAY_SPARKLE_STABLE_FEED_URL }}
      RELAY_SPARKLE_BETA_FEED_URL: ${{ vars.RELAY_SPARKLE_BETA_FEED_URL }}
      CODEX_MIN_VERSION: ${{ vars.CODEX_MIN_VERSION }}
      CODEX_MAX_VERSION: ${{ vars.CODEX_MAX_VERSION }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELAY_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.RELAY_RELEASE_PRIVATE_KEY_BASE64 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release inputs
        run: |
          version=${RELAY_VERSION#v}
          test "${RELAY_VERSION}" = "v${version}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -n "${RELAY_RELEASE_PUBLIC_KEY_BASE64}"
          test -n "${RELAY_SPARKLE_PUBLIC_KEY}"
          [[ "${RELAY_SPARKLE_STABLE_FEED_URL}" == https://* ]]
          [[ "${RELAY_SPARKLE_BETA_FEED_URL}" == https://* ]]
          test -n "${CODEX_MIN_VERSION}"
          test -n "${CODEX_MAX_VERSION}"
          test -n "${APPLE_SIGNING_IDENTITY}"
          test -n "${APPLE_CERTIFICATE_BASE64}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${APPLE_ID}"
          test -n "${APPLE_APP_SPECIFIC_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${RELAY_RELEASE_PRIVATE_KEY_BASE64}"
          test -n "${SPARKLE_PRIVATE_KEY}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELAY_VERSION}")"
          echo "RELAY_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Import protected signing material
        run: |
          signing_root="${RUNNER_TEMP}/relay-signing"
          mkdir -p "${signing_root}"
          chmod 700 "${signing_root}"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${signing_root}/developer-id.p12"
          chmod 600 "${signing_root}/developer-id.p12"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "${keychain_password}" "${signing_root}/relay.keychain-db"
          security set-keychain-settings -lut 21600 "${signing_root}/relay.keychain-db"
          security unlock-keychain -p "${keychain_password}" "${signing_root}/relay.keychain-db"
          security import "${signing_root}/developer-id.p12" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${signing_root}/relay.keychain-db"
          security list-keychain -d user -s "${signing_root}/relay.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${signing_root}/relay.keychain-db"
          xcrun notarytool store-credentials relay-notary \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --keychain "${signing_root}/relay.keychain-db"
          echo "RELAY_SIGN_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
          echo "RELAY_OUTPUT_DIR=${GITHUB_WORKSPACE}/release/out" >> "${GITHUB_ENV}"
          echo "RELAY_NOTARY_KEYCHAIN=${signing_root}/relay.keychain-db" >> "${GITHUB_ENV}"
      - name: Run all automated release gates
        run: |
          pnpm test
          pnpm typecheck
          swift test --package-path mac
          swift test --package-path apple-watch
          scripts/check-watchos-source.sh
          xcodebuild \
            -project apple-watch/RelayWatch.xcodeproj \
            -scheme RelayWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "${RUNNER_TEMP}/relay-watch-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build and sign the bridge and Mac app
        run: |
          pnpm build:bridge-sea
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            dist/relay-bridge-arm64
          pnpm smoke:bridge-sea
          scripts/package-mac-app.sh
      - name: Notarize and staple
        run: |
          xcrun notarytool submit release/out/Relay.dmg \
            --keychain-profile relay-notary \
            --keychain "${RELAY_NOTARY_KEYCHAIN}" \
            --wait
          xcrun stapler staple release/out/Relay.dmg
          xcrun stapler validate release/out/Relay.dmg
          codesign --verify --deep --strict --verbose=2 release/out/Relay.app
      - name: Assemble signed release metadata
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md docs/COMPATIBILITY.md release/out/
          git archive \
            --format=tar.gz \
            --prefix="Relay-${RELAY_VERSION}/" \
            --output="release/out/Relay-${RELAY_VERSION}.tar.gz" \
            "${GITHUB_SHA}"
          node scripts/create-release-manifest.mjs \
            --artifacts release/out \
            --tag "v${RELAY_VERSION}" \
            --codex-min "${CODEX_MIN_VERSION}" \
            --codex-max "${CODEX_MAX_VERSION}" \
            --output release/out/release-payload.json
          node scripts/sign-release.mjs \
            --payload release/out/release-payload.json \
            --output release/out/release-manifest.json
          node scripts/verify-release.mjs \
            --manifest release/out/release-manifest.json \
            --artifacts release/out \
            --tag "v${RELAY_VERSION}" \
            --public-key-base64 "${RELAY_RELEASE_PUBLIC_KEY_BASE64}"
          cd release/out
          shasum -a 256 \
            Relay.dmg \
            "Relay-${RELAY_VERSION}.tar.gz" \
            LICENSE \
            NOTICE \
            THIRD_PARTY_NOTICES.md \
            COMPATIBILITY.md \
            release-manifest.json > SHA256SUMS
      - name: Generate signed stable or beta Sparkle feed
        run: |
          mkdir -p release/appcast-work release/pages
          curl -fsSL "${RELAY_SPARKLE_STABLE_FEED_URL}" \
            -o release/pages/appcast.xml || true
          curl -fsSL "${RELAY_SPARKLE_BETA_FEED_URL}" \
            -o release/pages/appcast-beta.xml || true
          feed_name=appcast.xml
          if [[ "${RELAY_VERSION}" == *-beta.* ]]; then
            feed_name=appcast-beta.xml
          fi
          if [[ -f "release/pages/${feed_name}" ]]; then
            cp "release/pages/${feed_name}" "release/appcast-work/${feed_name}"
          fi
          cp release/out/Relay.dmg release/appcast-work/Relay.dmg
          sparkle_tools="${GITHUB_WORKSPACE}/mac/.build/artifacts/sparkle/Sparkle/bin"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" |
            "${sparkle_tools}/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELAY_VERSION}/" \
              -o "${feed_name}" \
              release/appcast-work
          cp "release/appcast-work/${feed_name}" "release/pages/${feed_name}"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" |
            "${sparkle_tools}/sign_update" \
              --ed-key-file - \
              --verify \
              "release/pages/${feed_name}"
      - name: Upload verified GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/out/Relay.dmg
            release/out/Relay-*.tar.gz
            release/out/SHA256SUMS
            release/out/release-manifest.json
            release/out/LICENSE
            release/out/NOTICE
            release/out/THIRD_PARTY_NOTICES.md
            release/out/COMPATIBILITY.md
      - name: Upload signed appcasts for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: release/pages
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/relay-signing/relay.keychain-db" || true
          rm -f "${RUNNER_TEMP}/relay-signing/developer-id.p12"

  deploy-pages:
    name: Publish signed Sparkle feeds
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
